# Despliegue en la nube con Render (https://render.com) — plan gratuito.
# Render lee este archivo ("Blueprint") y crea automáticamente:
#   1. Una base de datos PostgreSQL.
#   2. Un servicio web que compila el frontend y enciende el backend.
# El backend entrega la página y la API desde la misma dirección, así la
# cookie del refresh token (SameSite=Strict) funciona sin problemas.
# Al arrancar, el backend aplica solo las migraciones pendientes.

databases:
  - name: pos-db
    plan: free
    databaseName: pos_restaurante

services:
  - type: web
    name: pos-restaurante
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run migrate -- --seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "7"
